name: build-and-release

# Автоматический запуск НА КАЖДЫЙ push в main - ничего руками включать не
# нужно. workflow_dispatch оставлен ДОПОЛНИТЕЛЬНО - просто кнопка "запустить
# вручную" из вкладки Actions, если что-то упало и нужно повторить без
# нового push.
#
# ОДИН общий релиз (не два раздельных, как было раньше) - собирает и клиент,
# и оба API-exe, публикует всё разом с текстовым описанием в теле релиза.
# Механика: build-client и build-api ТОЛЬКО собирают и складывают свои файлы
# в build-артефакты (actions/upload-artifact) - релиз не публикуют. Третий
# job (publish-release) ждёт оба (`needs:`), скачивает оба набора файлов
# (actions/download-artifact) и публикует их ОДНИМ релизом через
# softprops/action-gh-release. Если один из двух build-job'ов упадёт -
# publish-release не запустится вообще (весь релиз атомарный: либо оба
# продукта собрались и опубликовались, либо не публикуется ничего).
#
# Тег релиза - статический (RELEASE_TAG ниже). При повторном push
# softprops/action-gh-release сам обновит существующий релиз новыми
# файлами вместо создания дубликата - когда версию нужно поднять,
# меняешь RELEASE_TAG/CLIENT_VERSION/API_VERSION в env.

# ПРИМЕЧАНИЕ про npm install vs npm ci: в проекте нет package-lock.json
# (собирался package.json вручную, без сети для реального npm install) -
# поэтому сборка использует `npm install`, а не `npm ci`. Как только у
# кого-то локально с интернетом получится один раз выполнить `npm install`
# и закоммитить получившийся package-lock.json в репозиторий - можно (и
# стоит) вернуть здесь `npm ci` обратно: она детерминированная (ставит
# ровно то, что в локе, без пересчёта дерева зависимостей) и быстрее.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # нужно softprops/action-gh-release, чтобы создавать/обновлять релиз

env:
  RELEASE_TAG: v1.2
  CLIENT_VERSION: v1.2
  API_VERSION: v1.2

jobs:
  build-client:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # См. HANDOFF_7/11 - КРИТИЧНО: без этого блока клиент на свежей
      # установке требовал бы Python на машине конечного пользователя
      # (electron/main.ts::engineInvocation() падает на python3/main.py,
      # если рядом нет NanoDecompilerCLI.exe - а раньше exe появлялся
      # ТОЛЬКО после первого клика "Обновить" в уже запущенном клиенте).
      # Для обычного пользователя без Python это означало "приложение не
      # работает из коробки". Собираем exe ЗДЕСЬ, кладём его ПРЯМО в
      # resources/engine/ (плоско, не в dist/) ДО того, как electron-builder
      # упакует extraResources - тогда engineInvocation() увидит его сразу
      # при самом первом запуске, без Python вообще. Заодно пишем
      # .engine-api-version с текущим API_VERSION - без этого свежая
      # установка при первой проверке апдейтера всегда показывала бы
      # "доступно обновление", даже если exe уже самый новый (см.
      # electron/updater.ts - сравнение идёт именно по этому файлу).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить PyInstaller
        run: pip install pyinstaller

      - name: Собрать NanoDecompilerCLI.exe и встроить в клиент
        working-directory: resources/engine
        shell: pwsh
        run: |
          pyinstaller --onefile --name NanoDecompilerCLI --icon=icon.ico main.py
          Move-Item -Force dist/NanoDecompilerCLI.exe NanoDecompilerCLI.exe
          Remove-Item -Recurse -Force dist, build, NanoDecompilerCLI.spec
          Set-Content -Path .engine-api-version -Value $env:API_VERSION -NoNewline

      - name: Проверка - встроенный exe реально работает
        shell: pwsh
        run: |
          resources/engine/NanoDecompilerCLI.exe test_jars/EryBuyer-v1.jar out_check_client_cli --headless
          if (-not (Test-Path "out_check_client_cli")) { throw "CLI.exe (для клиента): out_dir не создан" }

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm install
        # npm ci требует уже существующий package-lock.json - у нас его нет
        # (собирался package.json руками, без доступа в сеть, чтобы сгенерировать
        # настоящий lock-файл). npm install подходит и без лока, но НЕ
        # детерминирован между запусками так же строго - см. заметку в конце
        # workflow про то, как закрепить package-lock.json на будущее.
        run: npm install

      - name: Собрать Electron-инсталлятор (npm run dist)
        run: npm run dist

      - name: Найти собранный .exe (electron-builder кладёт в dist/, ищем
          явно вместо жёсткого имени - оно зависит от productName+version)
        id: find_installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path "dist" -Filter "*.exe" -File |
                 Where-Object { $_.Name -match "Setup" } |
                 Select-Object -First 1
          if (-not $exe) {
            # запасной вариант - ИСКЛЮЧАЕМ win-unpacked/ (сырой распакованный
            # .exe приложения, не инсталлятор) и elevate.exe (хелпер NSIS)
            $exe = Get-ChildItem -Path "dist" -Recurse -Filter "*.exe" -File |
                   Where-Object { $_.FullName -notmatch "win-unpacked" -and $_.Name -ne "elevate.exe" } |
                   Select-Object -First 1
          }
          if (-not $exe) { throw "Собранный .exe инсталлятора не найден - смотри логи electron-builder выше" }
          Copy-Item $exe.FullName -Destination "NanoDecompiler-Client-Setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: client-artifact
          path: NanoDecompiler-Client-Setup.exe
          if-no-files-found: error

  build-api:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить PyInstaller
        run: pip install pyinstaller

      # gui.py/gui_raw.py/gui_neon.py/gui_md3.py удалены из движка совсем -
      # Electron-клиент теперь единственный GUI, эти файлы были мёртвым
      # весом (см. main.py::main() - там теперь просто usage-сообщение
      # вместо попытки их импортировать).
      - name: Собрать NanoDecompilerCLI.exe (полный движок, main.py)
        working-directory: resources/engine
        run: pyinstaller --onefile --name NanoDecompilerCLI --icon=icon.ico main.py

      # api_cli.py нигде не упоминает gui.py даже транзитивно - PyInstaller
      # не включит tkinter/customtkinter/flet вообще, собранный exe
      # физически не способен открыть окно.
      - name: Собрать NanoDecompilerAPI.exe (голый API, api_cli.py)
        working-directory: resources/engine
        run: pyinstaller --onefile --name NanoDecompilerAPI --icon=icon.ico api_cli.py

      - name: Проверка - оба exe реально работают
        shell: pwsh
        run: |
          resources/engine/dist/NanoDecompilerCLI.exe test_jars/EryBuyer-v1.jar out_check_cli --api
          if (-not (Test-Path "out_check_cli")) { throw "CLI: out_dir не создан" }
          resources/engine/dist/NanoDecompilerAPI.exe test_jars/EryBuyer-v1.jar out_check_api
          if (-not (Test-Path "out_check_api")) { throw "API: out_dir не создан" }

      - uses: actions/upload-artifact@v4
        with:
          name: api-artifacts
          path: |
            resources/engine/dist/NanoDecompilerCLI.exe
            resources/engine/dist/NanoDecompilerAPI.exe
          if-no-files-found: error

  publish-release:
    needs: [build-client, build-api]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: client-artifact
          path: release-files

      - uses: actions/download-artifact@v4
        with:
          name: api-artifacts
          path: release-files

      # См. HANDOFF_7/16 - без этого файла апдейтер (electron/updater.ts)
      # не может отличить "поменялся только движок" (можно тихо подменить
      # .exe на лету) от "поменялся сам клиент" (GUI/Electron-обвязка -
      # так просто одним файлом не подменить, нужен новый инсталлятор) -
      # тег релиза (RELEASE_TAG) один на двоих, а CLIENT_VERSION/
      # API_VERSION по отдельности раньше были только в тексте релиза
      # (не машиночитаемо).
      - name: Сгенерировать versions.json (для апдейтера - client vs api)
        shell: bash
        run: |
          mkdir -p release-files
          printf '{"client":"%s","api":"%s"}' "$CLIENT_VERSION" "$API_VERSION" > release-files/versions.json

      - name: Публикация ОДНОГО релиза со всеми файлами и текстом
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "NanoDecompiler ${{ env.RELEASE_TAG }}"
          files: release-files/*
          body: |
            ## NanoDecompiler ${{ env.RELEASE_TAG }}

            Сборка от коммита `${{ github.sha }}`.

            ### Что внутри

            | Файл | Что это | Версия |
            |------|---------|--------|
            | `NanoDecompiler-Client-Setup.exe` | Клиентское приложение (Electron+React, полноценный GUI) - обычный инсталлятор, поставить и пользоваться | ${{ env.CLIENT_VERSION }} |
            | `NanoDecompilerAPI.exe` | Голый API, без GUI и без консоли - для встраивания в другие проекты: `NanoDecompilerAPI.exe plugin.jar [out_dir]`, ответ - JSON в stdout | ${{ env.API_VERSION }} |
            | `NanoDecompilerCLI.exe` | Тот же движок, что и в клиенте, но как отдельный консольный инструмент (флаги `--api`/`--json-output`/`--api-server`/`--install-tools`) | ${{ env.API_VERSION }} |
            | `versions.json` | Машиночитаемые версии client/api - для автообновления клиента, не для ручного использования | - |

            ### Как проверялось

            Оба API/CLI-exe перед публикацией прогонялись на тестовом
            `.jar`-плагине прямо в этом workflow - если декомпиляция не
            создавала папку с результатом, релиз не публикуется вообще.
