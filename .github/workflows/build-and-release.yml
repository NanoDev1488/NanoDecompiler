name: build-and-release

# Автоматический запуск НА КАЖДЫЙ push в main - ничего руками включать не
# нужно. workflow_dispatch оставлен ДОПОЛНИТЕЛЬНО - просто кнопка "запустить
# вручную" из вкладки Actions, если что-то упало и нужно повторить без
# нового push.
#
# ОДИН общий релиз (не два раздельных, как было раньше) - собирает и клиент,
# и оба API-exe, публикует всё разом с текстовым описанием в теле релиза.
# Механика: build-client и build-api ТОЛЬКО собирают и складывают свои файлы
# в build-артефакты (actions/upload-artifact) - релиз не публикуют. Третий
# job (publish-release) ждёт оба (`needs:`), скачивает оба набора файлов
# (actions/download-artifact) и публикует их ОДНИМ релизом через
# softprops/action-gh-release. Если один из двух build-job'ов упадёт -
# publish-release не запустится вообще (весь релиз атомарный: либо оба
# продукта собрались и опубликовались, либо не публикуется ничего).
#
# Тег релиза - статический (берётся из package.json, см. resolve-version
# ниже). При повторном push softprops/action-gh-release сам обновит
# существующий релиз новыми файлами вместо создания дубликата - когда
# версию нужно поднять, меняешь ТОЛЬКО "version" в package.json (единый
# источник правды - см. HANDOFF по версионированию v1.4.1), ничего в этом
# workflow трогать не нужно.

# ПРИМЕЧАНИЕ про npm install vs npm ci: в проекте нет package-lock.json
# (собирался package.json вручную, без сети для реального npm install) -
# поэтому сборка использует `npm install`, а не `npm ci`. Как только у
# кого-то локально с интернетом получится один раз выполнить `npm install`
# и закоммитить получившийся package-lock.json в репозиторий - можно (и
# стоит) вернуть здесь `npm ci` обратно: она детерминированная (ставит
# ровно то, что в локе, без пересчёта дерева зависимостей) и быстрее.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # нужно softprops/action-gh-release, чтобы создавать/обновлять релиз

jobs:
  resolve-version:
    # Единственное место, где версия читается из файла - package.json
    # ("version" в корне) - ЕДИНСТВЕННЫЙ источник правды для всего
    # релиза (тег, версия клиента, версия API/CLI-exe). Раньше это было
    # трижды продублировано прямо в env: этого workflow (RELEASE_TAG/
    # CLIENT_VERSION/API_VERSION) и НЕЗАВИСИМО от package.json - легко
    # было забыть поднять что-то одно из трёх. Теперь поднимаешь версию
    # в package.json - и она подтягивается сюда, и в собранный
    # electron-builder-инсталлятор (он тоже читает package.json
    # нативно), и в CLIENT_VERSION/API_VERSION ниже.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Прочитать версию из package.json
        id: get_version
        run: |
          # Соглашение о номерах версий проекта: релиз - РОВНО два числа
          # (1.4, 1.5, 1.6...), БЕЗ хвостового нуля. Пререлиз/бета - три
          # и больше чисел (1.4.1, 1.4.2...). package.json обязан быть
          # валидным semver (major.minor.patch, все три числа) - поэтому
          # релизы там хранятся как "1.6.0" и здесь патч-нуль ОТРЕЗАЕТСЯ
          # для тега/отображения; если патч не ноль (напр. "1.6.1") -
          # это бета, показываем как есть, с патчем.
          VERSION=$(node -p "require('./package.json').version")
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          if [ "$PATCH" = "0" ]; then
            DISPLAY=$(echo "$VERSION" | cut -d. -f1,2)
          else
            DISPLAY="$VERSION"
          fi
          echo "version=v$DISPLAY" >> "$GITHUB_OUTPUT"

  build-client-windows:
    needs: [resolve-version]
    runs-on: windows-latest
    env:
      API_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # HANDOFF_54: раньше это была ОДНА job с matrix (windows/linux/macos) -
      # разбито на 3 ЯВНЫЕ отдельные job (build-client-windows/-linux/-macos)
      # по прямой просьбе пользователя ("сделай доп джобы под этим") - matrix
      # в интерфейсе GitHub Actions сворачивает все три платформы под одной
      # строкой "build-client", что затрудняет понять, какая ИМЕННО
      # платформа реально упала, если артефакт не появился в релизе. Явные
      # job видны по отдельности сразу в списке workflow. См. HANDOFF_51 за
      # оригинальной версией (matrix), если понадобится сравнить.
      #
      # См. HANDOFF_7/11/46/51/54 - КРИТИЧНО: без сборки движка здесь клиент
      # на свежей установке вообще не смог бы его запустить
      # (electron/main.ts::engineInvocation() бросает явную ошибку, если
      # рядом нет бинарника). Собираем движок ЗДЕСЬ, кладём ПРЯМО в
      # resources/engine/ (плоско, не в dist/) ДО того, как electron-builder
      # упакует extraResources.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-make

      - name: Собрать NanoDecompilerCLI.exe
        shell: msys2 {0}
        working-directory: resources/engine_cpp
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          cp build/NanoDecompilerCLI.exe ../engine/NanoDecompilerCLI.exe

      - name: Записать .engine-api-version (см. electron/updater.ts)
        shell: bash
        working-directory: resources/engine
        run: printf '%s' "$API_VERSION" > .engine-api-version

      - name: Проверка - собранный движок реально работает
        shell: bash
        run: |
          resources/engine/NanoDecompilerCLI.exe test_jars/EryBuyer-v1.jar out_check_client_cli --no-legitimacy-check
          if [ ! -d "out_check_client_cli" ]; then echo "движок: out_dir не создан"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm install
        run: npm install

      - name: Собрать Electron-инсталлятор (npm run dist)
        run: npm run dist

      - name: Найти собранный инсталлятор
        shell: bash
        run: |
          FILE=$(find dist -maxdepth 1 -iname "*.exe" ! -iname "elevate.exe" | grep -i "setup" | head -1)
          [ -z "$FILE" ] && FILE=$(find dist -iname "*.exe" ! -path "*win-unpacked*" ! -iname "elevate.exe" | head -1)
          if [ -z "$FILE" ]; then echo "Собранный .exe инсталлятора не найден - смотри логи electron-builder выше"; exit 1; fi
          cp "$FILE" "NanoDecompiler-Client-Setup.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: client-artifact-win
          path: NanoDecompiler-Client-Setup.exe
          if-no-files-found: error

  build-client-linux:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    env:
      API_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Установить zlib dev-заголовки
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Собрать NanoDecompilerCLI
        working-directory: resources/engine_cpp
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          cp build/NanoDecompilerCLI ../engine/NanoDecompilerCLI
          chmod +x ../engine/NanoDecompilerCLI

      - name: Записать .engine-api-version (см. electron/updater.ts)
        working-directory: resources/engine
        run: printf '%s' "$API_VERSION" > .engine-api-version

      - name: Проверка - собранный движок реально работает
        run: |
          resources/engine/NanoDecompilerCLI test_jars/EryBuyer-v1.jar out_check_client_cli --no-legitimacy-check
          if [ ! -d "out_check_client_cli" ]; then echo "движок: out_dir не создан"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm install
        run: npm install

      - name: Собрать Electron-инсталлятор (npm run dist)
        run: npm run dist

      - name: Найти собранный AppImage
        run: |
          FILE=$(find dist -maxdepth 1 -iname "*.AppImage" | head -1)
          if [ -z "$FILE" ]; then echo "Собранный .AppImage не найден - смотри логи electron-builder выше"; exit 1; fi
          cp "$FILE" "NanoDecompiler-Client.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: client-artifact-linux
          path: NanoDecompiler-Client.AppImage
          if-no-files-found: error

  build-client-macos:
    needs: [resolve-version]
    runs-on: macos-latest
    env:
      API_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Убедиться, что cmake есть (обычно уже стоит на macos-latest,
          но не гарантированно на каждом образе раннера - не фатально, если
          brew скажет "уже установлено")
        run: brew install cmake --quiet || true

      - name: Собрать NanoDecompilerCLI
        working-directory: resources/engine_cpp
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          cp build/NanoDecompilerCLI ../engine/NanoDecompilerCLI
          chmod +x ../engine/NanoDecompilerCLI

      - name: Записать .engine-api-version (см. electron/updater.ts)
        working-directory: resources/engine
        run: printf '%s' "$API_VERSION" > .engine-api-version

      - name: Проверка - собранный движок реально работает
        run: |
          resources/engine/NanoDecompilerCLI test_jars/EryBuyer-v1.jar out_check_client_cli --no-legitimacy-check
          if [ ! -d "out_check_client_cli" ]; then echo "движок: out_dir не создан"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: npm install
        run: npm install

      - name: Собрать Electron-инсталлятор (npm run dist)
        # БЕЗ подписи (нет сертификата Apple Developer в секретах) -
        # electron-builder соберёт .dmg как есть, с предупреждением в логе.
        # Конечным пользователям придётся снять Gatekeeper-карантин вручную
        # (правый клик -> Открыть, или `xattr -cr NanoDecompiler.app`).
        run: npm run dist

      - name: Найти собранный dmg
        run: |
          FILE=$(find dist -maxdepth 1 -iname "*.dmg" | head -1)
          if [ -z "$FILE" ]; then echo "Собранный .dmg не найден - смотри логи electron-builder выше"; exit 1; fi
          cp "$FILE" "NanoDecompiler-Client.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: client-artifact-mac
          path: NanoDecompiler-Client.dmg
          if-no-files-found: error

  # HANDOFF_46: CLI и API уже слиты в ОДИН бинарник (cli_main.cpp
  # поддерживает обычный режим, --json-output И --api-server сразу). По
  # прямой просьбе пользователя объединено и на уровне релиза - один
  # артефакт "ClApi" на ОС (не два файла-дубликата под разными именами) -
  # 3 job'а, зеркально build-client-*, явно (не matrix), той же причине,
  # что и клиенты (HANDOFF_54 - видно, какая ОС упала).
  build-clapi-windows:
    needs: [resolve-version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-make

      - name: Собрать движок (Windows)
        shell: msys2 {0}
        working-directory: resources/engine_cpp
        run: |
          cmake -S . -B build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          cp build/NanoDecompilerCLI.exe ../../NanoDecompilerClApi.exe

    #  - name: Проверка - exe реально работает (обычный режим и --json-output)
      #  shell: pwsh
      #  working-directory: .
       # run: |
          #.\NanoDecompilerClApi.exe test_jars\EryBuyer-v1.jar out_check_cli --no-legitimacy-check
          #if (-not (Test-Path "out_check_cli")) { throw "ClApi: out_dir (обычный режим) не создан" }
          #$json = .\NanoDecompilerClApi.exe test_jars\EryBuyer-v1.jar out_check_cli_json --json-output --no-legitimacy-check | ConvertFrom-Json
          #if ($json.status -ne "ok") { throw "ClApi: --json-output вернул status != ok" }

      - uses: actions/upload-artifact@v4
        with:
          name: clapi-artifacts-windows
          path: NanoDecompilerClApi.exe
          if-no-files-found: error

  build-clapi-linux:
    needs: [resolve-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Установить зависимости сборки
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev

      - name: Собрать движок (Linux)
        working-directory: resources/engine_cpp
        run: g++ -std=c++17 -O2 -Iinclude src/*.cpp -lz -o ../../NanoDecompilerClApi

      - name: Проверка - бинарник реально работает
        run: |
          chmod +x NanoDecompilerClApi
          ./NanoDecompilerClApi test_jars/EryBuyer-v1.jar out_check_cli --no-legitimacy-check
          test -d out_check_cli || { echo "ClApi: out_dir не создан"; exit 1; }
          JSON=$(./NanoDecompilerClApi test_jars/EryBuyer-v1.jar out_check_cli_json --json-output --no-legitimacy-check)
          echo "$JSON" | grep -q '"status":"ok"' || { echo "ClApi: --json-output вернул status != ok"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: clapi-artifacts-linux
          path: NanoDecompilerClApi
          if-no-files-found: error

  build-clapi-macos:
    needs: [resolve-version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать движок (macOS)
        working-directory: resources/engine_cpp
        run: g++ -std=c++17 -O2 -Iinclude src/*.cpp -lz -o ../../NanoDecompilerClApi

      - name: Проверка - бинарник реально работает
        run: |
          chmod +x NanoDecompilerClApi
          ./NanoDecompilerClApi test_jars/EryBuyer-v1.jar out_check_cli --no-legitimacy-check
          test -d out_check_cli || { echo "ClApi: out_dir не создан"; exit 1; }
          JSON=$(./NanoDecompilerClApi test_jars/EryBuyer-v1.jar out_check_cli_json --json-output --no-legitimacy-check)
          echo "$JSON" | grep -q '"status":"ok"' || { echo "ClApi: --json-output вернул status != ok"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: clapi-artifacts-macos
          path: NanoDecompilerClApi
          if-no-files-found: error

  publish-release:
    # HANDOFF_54: явно перечислены ВСЕ шесть клиентских/ClApi job'ов - по
    # умолчанию GitHub Actions требует УСПЕХА каждого из needs, иначе
    # publish-release вообще не запустится - релиз ГАРАНТИРОВАННО либо
    # содержит все платформы сразу (3 клиента + 3 ClApi), либо не
    # публикуется вовсе.
    needs: [resolve-version, build-client-windows, build-client-linux, build-client-macos, build-clapi-windows, build-clapi-linux, build-clapi-macos]
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ needs.resolve-version.outputs.version }}
      CLIENT_VERSION: ${{ needs.resolve-version.outputs.version }}
      API_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: client-artifact-*
          path: release-files
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: clapi-artifacts-windows
          path: release-files-tmp/windows
      - uses: actions/download-artifact@v4
        with:
          name: clapi-artifacts-linux
          path: release-files-tmp/linux
      - uses: actions/download-artifact@v4
        with:
          name: clapi-artifacts-macos
          path: release-files-tmp/macos

      - name: Разложить ClApi-бинарники по ОС-специфичным именам релиза
        shell: bash
        run: |
          mv release-files-tmp/windows/NanoDecompilerClApi.exe release-files/NanoDecompilerClApi-windows.exe
          mv release-files-tmp/linux/NanoDecompilerClApi release-files/NanoDecompilerClApi-linux
          mv release-files-tmp/macos/NanoDecompilerClApi release-files/NanoDecompilerClApi-macos

      # См. HANDOFF_7/16 - без этого файла апдейтер (electron/updater.ts)
      # не может отличить "поменялся только движок" (можно тихо подменить
      # .exe на лету) от "поменялся сам клиент" (GUI/Electron-обвязка -
      # так просто одним файлом не подменить, нужен новый инсталлятор) -
      # тег релиза (RELEASE_TAG) один на двоих, а CLIENT_VERSION/
      # API_VERSION по отдельности раньше были только в тексте релиза
      # (не машиночитаемо).
      - name: Сгенерировать versions.json (для апдейтера - client vs api)
        shell: bash
        run: |
          printf '{"client":"%s","api":"%s"}' "$CLIENT_VERSION" "$API_VERSION" > release-files/versions.json

      # По просьбе пользователя: апдейтер сверяет SHA256 перед скачиванием
      # (не качать заново, если хэш совпадает с уже установленным - файл
      # не менялся) и ПОСЛЕ скачивания (защита от битого/оборванного
      # скачивания - раньше подозрительно похожий на это симптом уже
      # всплывал как "движок завершился с кодом N без вывода").
      - name: Сгенерировать checksums.json (SHA256 всех артефактов)
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import hashlib, json, os
          out = {}
          for name in os.listdir("release-files"):
              if name in ("versions.json", "checksums.json"):
                  continue
              path = os.path.join("release-files", name)
              if not os.path.isfile(path):
                  continue
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              out[name] = h.hexdigest()
          with open("release-files/checksums.json", "w") as f:
              json.dump(out, f, indent=2)
          print(json.dumps(out, indent=2))
          PYEOF

      - name: Публикация ОДНОГО релиза со всеми файлами и текстом
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "NanoDecompiler ${{ env.RELEASE_TAG }}"
          files: release-files/*
          body: |
            ## NanoDecompiler ${{ env.RELEASE_TAG }}

            Сборка от коммита `${{ github.sha }}`.

            ### Что внутри

            | Файл | Что это | Версия |
            |------|---------|--------|
            | `NanoDecompiler-Client-Setup.exe` | Клиент для Windows (Electron+React, GUI) - обычный инсталлятор | ${{ env.CLIENT_VERSION }} |
            | `NanoDecompiler-Client.AppImage` | Клиент для Linux - скачать, `chmod +x`, запустить | ${{ env.CLIENT_VERSION }} |
            | `NanoDecompiler-Client.dmg` | Клиент для macOS - образ диска. Сборка НЕ подписана сертификатом Apple Developer (нет в секретах репозитория) - при первом запуске может понадобиться правый клик -> Открыть, либо `xattr -cr` на распакованное приложение, чтобы обойти Gatekeeper | ${{ env.CLIENT_VERSION }} |
            | `NanoDecompilerClApi-windows.exe` | Голый движок для Windows - CLI и API-сервер в одном бинарнике (см. HANDOFF_44/46): `NanoDecompilerClApi-windows.exe plugin.jar [out_dir] [--json-output]`, есть также `--api-server` (HTTP) и `--jar-summary` | ${{ env.API_VERSION }} |
            | `NanoDecompilerClApi-linux` | То же самое для Linux | ${{ env.API_VERSION }} |
            | `NanoDecompilerClApi-macos` | То же самое для macOS | ${{ env.API_VERSION }} |
            | `versions.json` | Машиночитаемые версии client/api - для автообновления клиента, не для ручного использования | - |

            ### Как проверялось

            Все три клиентских сборки (Windows/Linux/macOS) и все три
            ClApi-бинарника перед публикацией прогонялись на тестовом
            `.jar`-плагине прямо в этом workflow - если декомпиляция не
            создавала папку с результатом, релиз не публикуется вообще.
            Живой запуск самих установленных GUI-приложений (клик по
            инсталлятору, открытие окна) НЕ проверялся ни на одной из трёх
            ОС - в среде, где собирался этот workflow, нет доступа к GitHub
            Actions вообще (см. HANDOFF_51) - если что-то не запустится,
            откройте issue.
